# Builds de Windows y macOS (hito 13.15), también de la demo de la parte 1 (hito 13.17). Se lanza al subir una etiqueta de versión (v0.9.1,
# con tools/publicar.sh) o a mano desde la pestaña Actions de GitHub («Run workflow»).
# Pasa los tests y la revisión de los costados, comprime los modelos y exporta con los perfiles
# de export_presets.cfg, como tools/exportar.sh. Con etiqueta, deja los dos zip en una Release en
# borrador (para revisarla y publicarla a mano); a mano, solo en la ejecución (Artifacts).
# Sin firma de macOS (firma ad hoc del propio Godot, como en local).
name: Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT: /home/runner/godot/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versión del juego
        id: version
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión de project.godot ($v). Usa tools/publicar.sh."
            exit 1
          fi
          echo "Versión $v"

      - name: Caché de Godot y sus plantillas
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-win-mac-rcedit

      - name: Descargar Godot y las plantillas de Windows y macOS
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p /home/runner/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d /home/runner/godot
          mv /home/runner/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 "$GODOT"
          chmod +x "$GODOT"
          tpl=/home/runner/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # solo las que se usan: el paquete entero ocupa más de 1 GB
          unzip -q -j -o templates.tpz templates/version.txt templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe templates/macos.zip -d "$tpl"
          rm godot.zip templates.tpz
          ls -la "$tpl"
          # rcedit pone el icono y los datos del .exe (application/modify_resources); en Linux, con wine
          curl -sSL -o /home/runner/godot/rcedit-x64.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe

      - name: Wine para rcedit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine64 > /dev/null
          WINEDEBUG=-all wineboot --init > /dev/null 2>&1 || true
          wine=$(command -v wine64 || command -v wine)
          mkdir -p /home/runner/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/windows/rcedit = "/home/runner/godot/rcedit-x64.exe"\nexport/windows/wine = "%s"\n' "$wine" \
            > /home/runner/.config/godot/editor_settings-4.4.tres
          cat /home/runner/.config/godot/editor_settings-4.4.tres

      # Las importaciones (texturas comprimidas, sobre todo) tardan; Godot rehace solo las que cambian.
      - name: Caché de las importaciones
        uses: actions/cache@v4
        with:
          path: .godot
          key: import-${{ env.GODOT_VERSION }}-${{ github.sha }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Importar el proyecto
        run: |
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: Tests
        run: |
          set -o pipefail
          "$GODOT" --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee tests.log | grep -E "^\s*(Passing|Failing|Pending|Tests|Asserts)\s" || true
          if grep -qE "^\s*Failing\s+[1-9]" tests.log || ! grep -qE "^\s*Passing\s+[1-9]" tests.log; then
            grep -E "\[Failed\]|FAILED|SCRIPT ERROR" -A3 tests.log | head -80
            echo "::error::Fallan tests"
            exit 1
          fi

      - name: Costados de personajes y prendas
        run: python3 tools/revisar_costados.py

      - name: Comprimir los modelos y exportar
        run: |
          "$GODOT" --headless --path . -s tools/empaquetar_modelos.gd
          mkdir -p builds/windows builds/macos
          "$GODOT" --headless --path . --export-release "Windows Desktop" builds/windows/LovecraftLibrary.exe 2>&1 | tee export.log
          if grep -q "Resources Modification" export.log; then
            echo "::error::rcedit no ha podido poner el icono y los datos del .exe"
            exit 1
          fi
          "$GODOT" --headless --path . --export-release "macOS" builds/macos/LovecraftLibrary.zip
          mkdir -p builds/demo/windows builds/demo/macos
          "$GODOT" --headless --path . --export-release "Windows Demo" builds/demo/windows/LovecraftLibraryDemo.exe 2>&1 | tee export_demo.log
          if grep -q "Resources Modification" export_demo.log; then
            echo "::error::rcedit no ha podido poner el icono y los datos del .exe de la demo"
            exit 1
          fi
          "$GODOT" --headless --path . --export-release "macOS Demo" builds/demo/macos/LovecraftLibraryDemo.zip
          test -s builds/windows/LovecraftLibrary.exe
          test -s builds/macos/LovecraftLibrary.zip
          test -s builds/demo/windows/LovecraftLibraryDemo.exe
          test -s builds/demo/macos/LovecraftLibraryDemo.zip
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          (cd builds/windows && zip -q -9 "../../dist/LovecraftLibrary-${v}-windows.zip" LovecraftLibrary.exe)
          cp builds/macos/LovecraftLibrary.zip "dist/LovecraftLibrary-${v}-macos.zip"
          (cd builds/demo/windows && zip -q -9 "../../../dist/LovecraftLibrary-${v}-demo-windows.zip" LovecraftLibraryDemo.exe)
          cp builds/demo/macos/LovecraftLibraryDemo.zip "dist/LovecraftLibrary-${v}-demo-macos.zip"
          ls -la dist

      - name: Guardar las builds en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: LovecraftLibrary-${{ steps.version.outputs.version }}
          path: dist/*.zip
          compression-level: 0
          retention-days: 30

      - name: Release en borrador
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<'EOF'
          **Windows:** descomprime y abre `LovecraftLibrary.exe`.
          **macOS:** descomprime; la primera vez, clic derecho sobre la aplicación y «Abrir» (no está firmada con un certificado de Apple).
          **Demo** (`-demo-`): la parte 1 entera, cuatro investigadores y cooperativo local.
          En red, todos los PC tienen que llevar la misma versión.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --generate-notes \
            --title "Lovecraft Library ${{ steps.version.outputs.version }}" --notes-file notas.md
